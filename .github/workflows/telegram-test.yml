name: Telegram Delivery Test

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e .

      - name: Diagnose Telegram connection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          base = f"https://api.telegram.org/bot{token}"

          def get(path):
              with urlopen(Request(f"{base}/{path}", method="GET")) as response:
                  return json.loads(response.read().decode("utf-8"))

          me = get("getMe")
          chat = get(f"getChat?chat_id={chat_id}")

          print("Bot API status:", me.get("ok"))
          print("Bot username:", me.get("result", {}).get("username"))
          print("Chat API status:", chat.get("ok"))
          if chat.get("ok"):
              result = chat["result"]
              print("Chat type:", result.get("type"))
              print("Chat title:", result.get("title"))
              print("Chat username:", result.get("username"))
          else:
              print("Chat error:", chat.get("description"))
          PY

      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os

          from app.delivery.telegram import TelegramSender

          TelegramSender.from_environment().send_message(
              os.environ["TELEGRAM_CHAT_ID"],
              "TRADE ORACLE\n\nTelegram delivery test successful.",
          )
          print("Telegram delivery test completed.")
          PY
